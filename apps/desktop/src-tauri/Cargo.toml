[package]
name = "socialspeak-desktop"
description = "Sideband desktop shell"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "socialspeak_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json.workspace = true

[dependencies]
bytes.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
ss-audio = { workspace = true, features = ["aec", "rnnoise"] }
reqwest.workspace = true
tempfile.workspace = true
ss-client-core = { workspace = true, features = ["macos-voiceio", "screen-share"] }
ss-input.workspace = true
ss-video = { workspace = true, features = ["render"] }
wgpu = "30"
font8x8 = "0.3"
ss-core.workspace = true
ss-net.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png", "unstable"] }
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
tokio.workspace = true
ts-rs = { version = "11", features = ["serde-compat"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"

[dev-dependencies]
moq-video = { workspace = true, features = ["openh264"] }
moq-net.workspace = true
tempfile.workspace = true
ss-server = { path = "../../../crates/ss-server" }

[target.'cfg(target_os = "linux")'.dependencies]
ss-video = { workspace = true, features = ["pipewire"] }

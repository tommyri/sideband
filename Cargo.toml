[workspace]
resolver = "3"
members = [
  "crates/ss-audio",
  "crates/ss-cli",
  "crates/ss-client-core",
  "crates/ss-core",
  "crates/ss-input",
  "crates/ss-net",
  "crates/ss-proto",
  "crates/ss-server",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.99"
version = "0.1.0"

[workspace.dependencies]
# macOS listen-only input taps and their dedicated Core Foundation run loop.
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGEvent", "CGEventTypes", "CGEventSource", "CGRemoteOperation"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFMachPort", "CFRunLoop", "CFDate", "CFString"] }
ss-audio = { path = "crates/ss-audio", version = "0.1.0" }
ss-client-core = { path = "crates/ss-client-core", version = "0.1.0" }
ss-core = { path = "crates/ss-core", version = "0.1.0" }
ss-input = { path = "crates/ss-input", version = "0.1.0" }
ss-net = { path = "crates/ss-net", version = "0.1.0" }
ss-proto = { path = "crates/ss-proto", version = "0.1.0" }

allocation-counter = "0.8"
# Optional RNNoise speech probability; no CLI, C API, or signal adapters.
nnnoiseless = { version = "=0.5.2", default-features = false }
anyhow = "1"
# In-memory permission snapshot. Handlers swap it after a role mutation.
arc-swap = "1"
# Argon2id password hashing. The server calls it on a blocking thread.
argon2 = "0.5"
axum = "0.8"
base64 = "0.22"
bitflags = "2"
bytes = "1"
criterion = "0.7"
# OSCE also compiles Deep PLC; DRED remains a separate opt-in feature.
opusic-c = { version = "=1.6.1", features = ["osce"] }
clap = { version = "4", features = ["derive"] }
# TOML config plus environment overrides. Unknown file keys stay errors.
figment = { version = "0.10", features = ["toml", "env"] }
# ACME's state machine is a `Stream`.
futures = { version = "0.3", default-features = false, features = ["std"] }
crossterm = "0.28"
getrandom = "0.2"
# Per-IP login limits. Keyed quotas live in memory for the process lifetime.
governor = "0.10"
# Signed download tokens. HMAC-SHA256 over the attachment id and expiry.
hmac = "0.12"
# Image width and height, including EXIF orientation. No re-encode in v1.
# Public HTTP accept loop: header-read deadline and a connection cap. Axum's
# `serve` sets neither. Both crates are already in the graph through axum.
hyper = { version = "1", default-features = false }
hyper-util = { version = "0.1", default-features = false, features = ["http1", "http2", "server-auto", "service", "tokio"] }
# NFC for display, channel, role, and webhook names. Already compiled in
# through `url`'s IDNA support; this adds no crate to the graph.
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }
# General category and Default_Ignorable_Code_Point for the same names. Also
# already in the graph through IDNA.
icu_properties = { version = "2", default-features = false, features = ["compiled_data"] }
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
# Process counters. The internal listener renders them as Prometheus text.
metrics = "0.24"
# The crate's HTTP listener and push gateway pull aws-lc. We render the
# text ourselves, so those features stay off and the static build stays on ring.
metrics-exporter-prometheus = { version = "0.17", default-features = false }
# Content sniffing for uploads. The client-supplied type is ignored.
infer = "0.19"
# Certificate file changes. The QUIC socket stays open across a reload.
notify = "8"
# Hosts are selected by the target. Linux adds PipeWire and the realtime
# thread feature in ss-audio; those pull ALSA/PipeWire and must not build
# on macOS or Windows.
cpal = { version = "0.18", default-features = false }
# macOS microphone permission status (`AVAudioApplication.recordPermission`).
# CoreAudio opens a denied microphone and delivers zeros, so ss-audio asks first.
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-avf-audio = { version = "0.3", default-features = false, features = [
  "std",
  "AVAudioApplication",
] }
parking_lot = "0.12"
prost = "0.14"
prost-build = "0.14"
proptest = "1"
# Vendored protoc so ss-proto builds without a system protobuf compiler.
protoc-bin-vendored = "3"
# quinn 0.11 depends on rustls 0.23. rustls 0.24 is still a pre-release.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
quinn-udp = { version = "0.5", default-features = false }
# Preview fetches. No cookies, no system proxy, rustls only.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
rcgen = "0.14"
# ACME account, orders, and HTTP-01 challenges. Ring, same as QUIC. The cache lives in `tls/acme`.
rustls-acme = { version = "0.13", default-features = false, features = ["ring", "tls12", "tokio"] }
rtrb = "0.4"
# Sinc resampling only. The FFT resampler is a different algorithm.
rubato = { version = "5", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.6"
# Optional WebRTC APM port (AEC3, noise suppression, AGC2). Pure Rust; no
# examples feature, so no second cpal or CLI dependencies.
sonora = { version = "=0.2.0", default-features = false }
# Online database snapshot plus the attachments tree.
tar = "0.4"
tempfile = "3"
toml = "0.8"
tower = { version = "0.5", default-features = false, features = ["util"] }
webpki-roots = "1"
# SQLite only. Networked drivers and the `any` driver stay off.
sqlx = { version = "0.9", default-features = false, features = [
  "migrate",
  "runtime-tokio",
  "sqlite",
] }
thiserror = "2"
tokio = { version = "1", features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ulid = { version = "3", features = ["serde"] }
# Wipes session tokens, passwords, and the attachment signing key on drop.
zeroize = "1"

# Pedantic lints allowed workspace-wide. Each one is noisy here without
# catching defects:
# - module_name_repetitions: `server::ServerState` reads better than renaming
# - missing_errors_doc / missing_panics_doc: the error type is the contract
# - must_use_candidate: applied per function when dropping the value is a bug
# - doc_markdown: proper nouns and protocol names (SocialSpeak, QUIC, Opus)
#   are not code identifiers
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

# Optimize across crate boundaries on the packet-forwarding path.
[profile.release]
lto = "thin"
codegen-units = 1

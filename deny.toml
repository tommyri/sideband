# cargo-deny. Licenses are permissive only; advisories and yanked crates fail CI.
# https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
yanked = "deny"
ignore = [
  # gtk-rs 0.18 still uses this macro helper. The advisory is maintenance-only
  # and has no patched release; remove when Tauri moves off the GTK 3 stack.
  { id = "RUSTSEC-2024-0370", reason = "transitive GTK 3 macro dependency; unmaintained with no safe upgrade" },
  # zbus 5 split these types into separate crates. zbus 6 merged them back;
  # ashpd 0.13 and Tauri still require zbus 5. These are maintenance notices,
  # not vulnerabilities. Remove together when both upstreams adopt zbus 6.
  { id = "RUSTSEC-2026-0370", reason = "zvariant was merged into zbus 6; current ashpd/Tauri require zbus 5" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names was merged into zbus 6; current ashpd/Tauri require zbus 5" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive was merged into zbus 6; current ashpd/Tauri require zbus 5" },
]

[licenses]
version = 2
confidence-threshold = 0.8
# The allow-list covers licenses the stack will pull in. Nothing uses them
# yet, so don't warn about the unused entries.
unused-allowed-license = "allow"
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
]

# Mozilla trust-store data already used by ss-net. Keep the permission scoped
# to this dependency; redistribution must include its bundled LICENSE text.
[[licenses.exceptions]]
name = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

# cpal 0.18 promotes its audio threads through this crate. MPL-2.0 is
# file-level copyleft: shipping it unmodified in the desktop client is fine,
# and changes to its own files would have to be published. The server does
# not link it. Scoped to this crate only; maintainer sign-off noted in T-061.
[[licenses.exceptions]]
name = "audio_thread_priority"
allow = ["MPL-2.0"]

# Tauri's HTML/CSS parsing stack and directory helper use these MPL-2.0
# crates unmodified. MPL is file-level copyleft; any changes to those crate
# sources must remain MPL, but it does not apply to Sideband's source.
[[licenses.exceptions]]
name = "cssparser"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "cssparser-macros"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "dtoa-short"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "option-ext"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "selectors"
allow = ["MPL-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# One TLS crypto provider: rustls with ring, for QUIC, ACME, and previews.
# aws-lc breaks the static musl build and would make provider selection
# ambiguous; OpenSSL is not used at all.
deny = [
  { name = "aws-lc-rs", reason = "rustls is pinned to the ring provider" },
  { name = "aws-lc-sys", reason = "rustls is pinned to the ring provider" },
  { name = "openssl", reason = "TLS is rustls only" },
  { name = "openssl-sys", reason = "TLS is rustls only" },
  { name = "native-tls", reason = "TLS is rustls only" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

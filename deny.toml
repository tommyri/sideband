# cargo-deny. Licenses are permissive only; advisories and yanked crates fail CI.
# https://embarkstudios.github.io/cargo-deny/

[graph]
# Check optional dependencies too. Without this, the ss-video `vaapi` and
# `nvidia` backends (moq-vaapi, moq-nvenc, cudarc, bindgen 0.70,
# libloading 0.9 on 2026-11-11) were never license- or advisory-checked.
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # Loom, pulled by media/metrics dependencies, still needs this archived helper.
  # Maintenance notice only; remove when upstream replaces it.
  { id = "RUSTSEC-2026-0441", reason = "transitive loom dependency; maintenance-only with no safe upgrade" },
  # gtk-rs 0.18 still uses this macro helper. The advisory is maintenance-only
  # and has no patched release; remove when Tauri moves off the GTK 3 stack.
  { id = "RUSTSEC-2024-0370", reason = "transitive GTK 3 macro dependency; unmaintained with no safe upgrade" },
  # zbus 5 split these types into separate crates. zbus 6 merged them back;
  # ashpd 0.13 and Tauri still require zbus 5. These are maintenance notices,
  # not vulnerabilities. Remove together when both upstreams adopt zbus 6.
  { id = "RUSTSEC-2026-0370", reason = "zvariant was merged into zbus 6; current ashpd/Tauri require zbus 5" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names was merged into zbus 6; current ashpd/Tauri require zbus 5" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive was merged into zbus 6; current ashpd/Tauri require zbus 5" },
  # Added 2026-11-11 (T-110). Review by 2027-02-11, or as soon as an sqlx
  # release allows libsqlite3-sys 0.39: then upgrade and delete this entry.
  # libsqlite3-sys 0.37.0 bundles SQLite 3.51.3; the fix is SQLite 3.54.0
  # (libsqlite3-sys 0.39). sqlx-sqlite 0.9.0, the newest release, requires
  # libsqlite3-sys <0.38. Only ss-server links SQLite, and it opens only its
  # own data directory. A crafted `-wal` must already be in that directory,
  # which takes write access to it (the restore commands delete the WAL files
  # before extracting; a tar from an untrusted source can still carry one).
  # This ignores this advisory only, not advisories for libsqlite3-sys.
  { id = "RUSTSEC-2026-0459", reason = "bundled SQLite <3.54 WAL page-size read; sqlx 0.9.0 caps libsqlite3-sys <0.38; server opens only its own data dir; review 2027-02-11" },
]

[licenses]
version = 2
confidence-threshold = 0.8
# The allow-list covers licenses the stack will pull in. Nothing uses them
# yet, so don't warn about the unused entries.
unused-allowed-license = "allow"
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
]

# Mozilla trust-store data already used by ss-net. Keep the permission scoped
# to this dependency; redistribution must include its bundled LICENSE text.
[[licenses.exceptions]]
name = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

# Same Mozilla root-store data, used by reqwest's platform verifier.
[[licenses.exceptions]]
name = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

# cpal 0.18 and ss-audio promote their audio threads through this crate. MPL-2.0 is
# file-level copyleft: shipping it unmodified in the desktop client is fine,
# and changes to its own files would have to be published. The server does
# not link it. Scoped to this crate only; maintainer sign-off noted in T-061.
# On Linux its `with_dbus` feature (T-117) adds dbus 0.6.5 and libdbus-sys
# 0.2.7, both MIT OR Apache-2.0, which the allow-list already covers. dbus 0.6
# sits beside tao's dbus 0.9 (a `multiple-versions` warning only).
[[licenses.exceptions]]
name = "audio_thread_priority"
allow = ["MPL-2.0"]

# Tauri's HTML/CSS parsing stack and directory helper use these MPL-2.0
# crates unmodified. MPL is file-level copyleft; any changes to those crate
# sources must remain MPL, but it does not apply to Sideband's source.
[[licenses.exceptions]]
name = "cssparser"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "cssparser-macros"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "dtoa-short"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "option-ext"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "selectors"
allow = ["MPL-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# One TLS crypto provider: rustls with ring, for QUIC, ACME, and previews.
# aws-lc breaks the static musl build and would make provider selection
# ambiguous; OpenSSL is not used at all.
deny = [
  { name = "aws-lc-rs", reason = "rustls is pinned to the ring provider" },
  { name = "aws-lc-sys", reason = "rustls is pinned to the ring provider" },
  { name = "openssl", reason = "TLS is rustls only" },
  { name = "openssl-sys", reason = "TLS is rustls only" },
  { name = "native-tls", reason = "TLS is rustls only" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

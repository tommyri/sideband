# Replace every sideband.example.com below with a domain you control.
# Install after issuing a certificate for sideband.example.com.
# This is an additional site; keep any existing website configurations intact.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sideband.example.com;

    ssl_certificate /etc/letsencrypt/live/sideband.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sideband.example.com/privkey.pem;
    ssl_protocols TLSv1.3;

    # Allow multipart overhead above the server's 25 MiB file limit.
    client_max_body_size 26m;
    location / {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_server_name on;
        proxy_ssl_name sideband.example.com;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        proxy_ssl_protocols TLSv1.3;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}

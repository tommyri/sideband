# Replace every sideband.example.com below with a domain you control.
# Install after issuing a certificate for sideband.example.com.
# This is an additional site; keep any existing website configurations intact.
# Ubuntu includes sites-enabled/ inside the http block, so the zones and the
# upstream below are http-level directives.

# Every proxied request reaches Sideband from 127.0.0.1, so the server's own
# per-address limits (a 200-request burst refilled at 50 per second, and 64
# open connections) are one bucket shared by all clients. These per-client
# limits stop one looping client from spending that bucket for everyone.
# Keep the totals below the server's: one client gets at most 10 requests
# per second with a burst of 40, and 16 open connections.
limit_req_zone $binary_remote_addr zone=sideband_requests:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=sideband_connections:10m;

# Reused TLS connections to the container. max_conns stays under the
# server's 64 connections per address, so NGINX answers 502 itself instead of
# opening a connection the server would close on accept.
upstream sideband {
    server 127.0.0.1:8443 max_conns=48;
    keepalive 16;
    keepalive_timeout 50s;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sideband.example.com;

    ssl_certificate /etc/letsencrypt/live/sideband.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sideband.example.com/privkey.pem;
    ssl_protocols TLSv1.3;

    # Allow multipart overhead above the server's 25 MiB file limit.
    client_max_body_size 26m;

    limit_req zone=sideband_requests burst=40 nodelay;
    limit_req_status 429;
    limit_conn sideband_connections 16;
    limit_conn_status 429;

    location / {
        proxy_pass https://sideband;
        proxy_ssl_server_name on;
        proxy_ssl_name sideband.example.com;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        proxy_ssl_protocols TLSv1.3;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Both are required for the upstream keepalive pool.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_ssl_session_reuse on;
        proxy_read_timeout 120s;
    }
}

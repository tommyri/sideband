# Standalone alternative to docker-compose.yml, for host-installed NGINX.
# Use this file alone so Docker does not also publish public TCP 443.
services:
  socialspeak:
    image: ${SIDEBAND_IMAGE:-ghcr.io/tommyri/sideband-server:0.0.1}
    restart: unless-stopped
    command: ["run", "--data-dir", "/data"]
    environment:
      SS_BIND_QUIC: 0.0.0.0:443
      SS_BIND_HTTP: 0.0.0.0:443
      SS_INTERNAL_BIND: 0.0.0.0:9101
      SS_TLS_MODE: files
      SS_TLS_CERT: /certificates/bundle.pem
      SS_TLS_KEY: /certificates/bundle.pem
    ports:
      - "443:443/udp"
      - "127.0.0.1:8443:443/tcp"
      - "127.0.0.1:9101:9101/tcp"
    volumes:
      - socialspeak:/data
      - /etc/sideband/tls:/certificates:ro
    cap_add:
      - NET_BIND_SERVICE
volumes:
  socialspeak:

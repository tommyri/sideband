name: CI preflight

on:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    uses: ./.github/workflows/check-frontend.yml

  dependencies:
    name: Rust dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99.1" # Keep aligned with rust-toolchain.toml.
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-deny
      # deny.toml includes optional features across the workspace.
      - run: cargo deny --locked check

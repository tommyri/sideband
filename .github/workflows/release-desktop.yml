name: Release desktop installers

# Publishes only from main. The updater key lives in the desktop-release environment
# (main only, required reviewer) and is given to one step of the publish job; the
# platform builds never see it. See docs/release.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (X.Y.Z); existing selected-platform assets will be replaced
        required: true
        default: "0.0.1"
        type: string
      notes:
        description: Release notes shown in the updater
        type: string
        default: Development preview
      updates:
        description: Create signed auto-update packages (requires updater keys)
        type: boolean
        default: true
      windows:
        description: Windows x64 NSIS and MSI installers
        type: boolean
        default: true
      macos:
        description: macOS Apple Silicon DMG and app ZIP
        type: boolean
        default: true
      macos_intel:
        description: macOS Intel DMG and app ZIP (additional runner)
        type: boolean
        default: false
      linux:
        description: Linux x64 deb and AppImage
        type: boolean
        default: true

  workflow_call:
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
    inputs:
      version:
        required: true
        type: string
      notes:
        required: true
        type: string
      alpha:
        type: boolean
        default: false
      updates:
        type: boolean
        default: true
      windows:
        type: boolean
        default: true
      macos:
        type: boolean
        default: true
      macos_intel:
        type: boolean
        default: false
      linux:
        type: boolean
        default: false

permissions:
  contents: read

# Serialize publication, including reruns of the same version.
concurrency:
  group: desktop-releases
  cancel-in-progress: false

jobs:
  approve-desktop-build:
    if: ${{ !inputs.alpha }}
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    environment: desktop-release
    permissions:
      contents: read
      actions: read
    steps:
      - &require-main
        name: Refuse refs other than main
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Desktop releases run only from refs/heads/main, not $GITHUB_REF"
            exit 1
          fi
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &check-release-policy
        name: Check environment protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-gate.mjs environment desktop-release
      - name: Check updater key is configured
        if: inputs.updates
        env:
          KEY_CONFIGURED: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ "$KEY_CONFIGURED" != true ]; then
            echo "::error::Signed updates require TAURI_SIGNING_PRIVATE_KEY in desktop-release"
            exit 1
          fi

  build-desktop:
    needs: approve-desktop-build
    uses: ./.github/workflows/build-desktop-release.yml
    permissions: &build-permissions
      contents: read
      actions: read
    with: &build-inputs
      version: ${{ inputs.version }}
      alpha: ${{ inputs.alpha || false }}
      updates: ${{ inputs.updates }}
      windows: ${{ inputs.windows }}
      macos: ${{ inputs.macos }}
      macos_intel: ${{ inputs.macos_intel }}
      linux: ${{ inputs.linux }}

  build-alpha:
    if: inputs.alpha
    uses: ./.github/workflows/build-desktop-release.yml
    permissions: *build-permissions
    with: *build-inputs

  publish:
    if: ${{ !inputs.alpha }}
    needs: build-desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: desktop-release
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps: &publish-steps
      - *require-main
      - *checkout
      - *check-release-policy
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sideband-test-*
          path: release-input
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: inputs.updates
        with:
          version: 12.18.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.updates
        with:
          node-version: 26.13.0
      # Only the locked Tauri CLI runs in the signing step. No dependency scripts run here.
      - name: Tauri signer (locked, no install scripts)
        if: inputs.updates
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Sign updater payloads
        if: inputs.updates
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/release-desktop.mjs sign release-input
      - name: Verify and name release assets
        env:
          RELEASE_NOTES: ${{ inputs.notes }}
          RELEASE_VERSION: ${{ inputs.version }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: node scripts/release-desktop.mjs stage release-input "$RUNNER_TEMP/release"
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/assets/*
      - name: Download smoke-tested server binaries
        if: inputs.alpha
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ss-server-*
          path: dist
          merge-multiple: true
      - name: Publish versioned alpha image
        if: inputs.alpha
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository }}-server
          VERSION: ${{ inputs.version }}
          MOVE_LATEST: 'false'
        run: bash scripts/publish-server-image.sh
      - name: Attest image
        if: inputs.alpha
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}-server
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Publish installers and update feeds
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/release-desktop.mjs publish "$RUNNER_TEMP/release"
      - name: Remove the registry login
        if: always() && inputs.alpha
        run: docker logout ghcr.io

  publish-alpha:
    name: Publish alpha installers, update feeds and Docker image
    if: inputs.alpha
    needs: build-alpha
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: desktop-release
    permissions:
      contents: write
      packages: write
      actions: read
      id-token: write
      attestations: write
    steps: *publish-steps

name: Release desktop installers

# Publishes only from main. The updater key lives in the desktop-release environment
# (main only, required reviewer) and is given to one step of the publish job; the
# platform builds never see it. See docs/release.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (X.Y.Z); existing selected-platform assets will be replaced
        required: true
        default: "0.0.1"
        type: string
      notes:
        description: Release notes shown in the updater
        type: string
        default: Development preview
      updates:
        description: Create signed auto-update packages (requires updater keys)
        type: boolean
        default: true
      windows:
        description: Windows x64 NSIS and MSI installers
        type: boolean
        default: true
      macos:
        description: macOS Apple Silicon DMG and app ZIP
        type: boolean
        default: true
      macos_intel:
        description: macOS Intel DMG and app ZIP (additional runner)
        type: boolean
        default: false
      linux:
        description: Linux x64 deb and AppImage
        type: boolean
        default: true

  workflow_call:
    inputs:
      version:
        required: true
        type: string
      notes:
        required: true
        type: string
      alpha:
        type: boolean
        default: false
      updates:
        type: boolean
        default: true
      windows:
        type: boolean
        default: true
      macos:
        type: boolean
        default: true
      macos_intel:
        type: boolean
        default: false
      linux:
        type: boolean
        default: false

permissions:
  contents: read

# Serialize publication, including reruns of the same version.
concurrency:
  group: desktop-releases
  cancel-in-progress: false

jobs:
  prepare:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    # Approving this job starts the release.
    environment: desktop-release
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.selection.outputs.matrix }}
    steps:
      - name: Refuse refs other than main
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Desktop releases run only from refs/heads/main, not $GITHUB_REF"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check environment protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-gate.mjs environment desktop-release
      - name: Release gate tests
        run: node --test scripts/release-gate.test.mjs
      - name: Validate version and selected platforms
        id: selection
        env:
          RELEASE_ALPHA: ${{ inputs.alpha || false }}
          RELEASE_UPDATES: ${{ inputs.updates }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          # Only whether the key is set; the key itself goes to the signing step.
          TAURI_SIGNING_KEY_CONFIGURED: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_WINDOWS: ${{ inputs.windows }}
          RELEASE_MACOS: ${{ inputs.macos }}
          RELEASE_MACOS_INTEL: ${{ inputs.macos_intel }}
          RELEASE_LINUX: ${{ inputs.linux }}
        run: node scripts/release-desktop.mjs select

  preflight:
    needs: prepare
    uses: ./.github/workflows/preflight.yml

  ci:
    needs: preflight
    uses: ./.github/workflows/check-platforms.yml

  build:
    needs: [prepare, preflight]
    uses: ./.github/workflows/package-desktop.yml
    # actions: read lets the signing jobs check their environment's protection.
    permissions:
      contents: read
      actions: read
    with:
      workspace_test_targets: '["x86_64-unknown-linux-gnu","aarch64-apple-darwin","x86_64-pc-windows-msvc"]'
      matrix: ${{ needs.prepare.outputs.matrix }}
      version: ${{ inputs.version }}
      updates: ${{ inputs.updates }}
      # OS code-signing and notarization credentials, if configured, for the
      # macos-signing and windows-signing jobs only. No updater key.
      environment: ${{ inputs.updates && 'desktop-signing' || '' }}

  server-build:
    if: inputs.alpha
    needs: preflight
    uses: ./.github/workflows/package-server.yml
    with:
      version: ${{ inputs.version }}

  publish-alpha-image:
    if: inputs.alpha
    needs: [ci, build, server-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: desktop-release
    permissions:
      contents: read
      packages: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Require main
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check environment protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-gate.mjs environment desktop-release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ss-server-*
          path: dist
          merge-multiple: true
      - name: Publish versioned alpha image
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository }}-server
          VERSION: ${{ inputs.version }}
          MOVE_LATEST: 'false'
        run: bash scripts/publish-server-image.sh
      - name: Attest image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}-server
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Remove the registry login
        if: always()
        run: docker logout ghcr.io

  publish:
    timeout-minutes: 20
    needs: [prepare, ci, build, publish-alpha-image]
    if: >-
      ${{ !cancelled() && needs.prepare.result == 'success' && needs.ci.result == 'success' &&
          needs.build.result == 'success' && (inputs.alpha && needs.publish-alpha-image.result == 'success' ||
          !inputs.alpha && needs.publish-alpha-image.result == 'skipped') }}
    runs-on: ubuntu-24.04
    # Approving this job signs the update payloads and publishes.
    environment: desktop-release
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Refuse refs other than main
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Desktop releases run only from refs/heads/main, not $GITHUB_REF"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check environment protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-gate.mjs environment desktop-release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sideband-test-*
          path: release-input
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: inputs.updates
        with:
          version: 12.18.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.updates
        with:
          node-version: 26.13.0
      # Only the locked Tauri CLI runs in the signing step. No dependency scripts run here.
      - name: Tauri signer (locked, no install scripts)
        if: inputs.updates
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Sign updater payloads
        if: inputs.updates
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/release-desktop.mjs sign release-input
      - name: Verify and name release assets
        env:
          RELEASE_NOTES: ${{ inputs.notes }}
          RELEASE_VERSION: ${{ inputs.version }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: node scripts/release-desktop.mjs stage release-input "$RUNNER_TEMP/release"
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/assets/*
      - name: Publish or replace development installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/release-desktop.mjs publish "$RUNNER_TEMP/release"

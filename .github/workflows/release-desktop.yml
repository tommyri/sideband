name: Release desktop installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (X.Y.Z); existing selected-platform assets will be replaced
        required: true
        default: "0.0.1"
        type: string
      notes:
        description: Release notes shown in the updater
        type: string
        default: Development preview
      updates:
        description: Create signed auto-update packages (requires updater keys)
        type: boolean
        default: true
      windows:
        description: Windows x64 NSIS and MSI installers
        type: boolean
        default: true
      macos:
        description: macOS Apple Silicon DMG and app ZIP
        type: boolean
        default: true
      macos_intel:
        description: macOS Intel DMG and app ZIP (additional runner)
        type: boolean
        default: false
      linux:
        description: Linux x64 deb and AppImage
        type: boolean
        default: true

permissions:
  contents: read

# Serialize publication, including reruns of the same version.
concurrency:
  group: desktop-releases
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.selection.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate version and selected platforms
        id: selection
        env:
          RELEASE_UPDATES: ${{ inputs.updates }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_WINDOWS: ${{ inputs.windows }}
          RELEASE_MACOS: ${{ inputs.macos }}
          RELEASE_MACOS_INTEL: ${{ inputs.macos_intel }}
          RELEASE_LINUX: ${{ inputs.linux }}
        run: node scripts/release-desktop.mjs select
      - name: Release tooling tests
        run: node --test scripts/build-test-desktop.test.mjs scripts/release-desktop.test.mjs

  build:
    needs: prepare
    uses: ./.github/workflows/test-desktop.yml
    with:
      matrix: ${{ needs.prepare.outputs.matrix }}
      version: ${{ inputs.version }}
      updates: ${{ inputs.updates }}
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sideband-test-*
          path: release-input
      - name: Publish or replace development installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.notes }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/release-desktop.mjs publish release-input

name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1" # Keep aligned with rust-toolchain.toml.
          components: clippy, rustfmt
      - name: Nightly rustfmt
        run: rustup toolchain install nightly --profile minimal --component rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Linux audio and desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpipewire-0.3-dev libclang-dev pkg-config cmake libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.18.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Desktop dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: just
      - name: Desktop checks
        run: just check-desktop
      - name: just check
        run: just check
      - name: Linux input integration tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y dbus xvfb xdotool
          dbus-run-session -- cargo test -p ss-input bind_activate_deactivate_session_loss_and_rebind -- --ignored --nocapture
          xvfb-run -a cargo test -p ss-input x11_native_key_mouse_capture_and_stop -- --ignored --nocapture
      - name: Optional Opus DRED
        run: cargo test -p ss-audio --features dred
      - name: Optional Opus DRED lints
        run: cargo clippy -p ss-audio --all-targets --features dred -- -D warnings
      - name: Optional RNNoise VAD
        run: cargo test -p ss-audio --features rnnoise
      - name: Optional RNNoise VAD lints
        run: cargo clippy -p ss-audio --all-targets --features rnnoise -- -D warnings
      - name: Opus frame budget
        run: cargo bench -p ss-audio --bench codec
      - name: Optional processing chain (AEC, RNNoise, AGC)
        run: cargo test -p ss-audio --all-features
      - name: Optional processing chain lints
        run: cargo clippy -p ss-audio --all-targets --all-features -- -D warnings
      - name: Processing frame budget
        run: cargo bench -p ss-audio --all-features --bench processing
      - name: Optional screen-share pipeline
        run: cargo test -p ss-client-core --features screen-share
      - name: Optional screen-share lints
        run: cargo clippy -p ss-client-core --all-targets --features screen-share -- -D warnings
      - name: Wayland PipeWire capture build
        if: runner.os == 'Linux'
        run: cargo clippy -p ss-video --all-targets --features pipewire -- -D warnings
      - name: Dependency graph
        if: runner.os == 'Linux'
        run: just check-deps
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-deny
        if: runner.os == 'Linux'
      - name: cargo deny
        if: runner.os == 'Linux'
        run: cargo deny check

  smoke:
    name: container smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1" # Keep aligned with rust-toolchain.toml.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Linux audio build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpipewire-0.3-dev libclang-dev pkg-config cmake
      - name: Image, healthz, and two bots
        run: bash deploy/smoke.sh

  reconnect-chaos:
    name: reconnect chaos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1" # Keep aligned with rust-toolchain.toml.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Linux audio build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpipewire-0.3-dev libclang-dev pkg-config cmake
      - name: Random 1-10 second outages for two minutes
        run: cargo test -p ss-server --test client_core two_minute_random_outages -- --ignored --nocapture

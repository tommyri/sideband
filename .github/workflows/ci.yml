name: CI

on:
  workflow_dispatch:
    inputs:
      benchmarks:
        description: Run release-profile audio benchmarks on all platforms (extra build time)
        type: boolean
        default: false
  workflow_call:
    inputs:
      benchmarks:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    uses: ./.github/workflows/preflight.yml

  ci:
    needs: preflight
    uses: ./.github/workflows/check-platforms.yml
    with:
      benchmarks: ${{ inputs.benchmarks }}

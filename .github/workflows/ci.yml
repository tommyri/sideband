name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          components: clippy, rustfmt
      - name: Nightly rustfmt
        run: rustup toolchain install nightly --profile minimal --component rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Linux audio build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpipewire-0.3-dev libclang-dev pkg-config cmake
      - uses: taiki-e/install-action@just
      - name: just check
        run: just check
      - name: Optional Opus DRED
        run: cargo test -p ss-audio --features dred
      - name: Optional Opus DRED lints
        run: cargo clippy -p ss-audio --all-targets --features dred -- -D warnings
      - name: Opus frame budget
        run: cargo bench -p ss-audio --bench codec
      - name: Dependency graph
        if: runner.os == 'Linux'
        run: just check-deps
      - uses: taiki-e/install-action@cargo-deny
        if: runner.os == 'Linux'
      - name: cargo deny
        if: runner.os == 'Linux'
        run: cargo deny check

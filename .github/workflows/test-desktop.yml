name: Desktop test builds

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      updates:
        type: boolean
        default: false
      matrix:
        type: string
        required: true
      version:
        type: string
        required: true
      # A manual dispatch builds packages without a signing environment.
      environment:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  preflight:
    uses: ./.github/workflows/preflight.yml

  build:
    needs: preflight
    uses: ./.github/workflows/package-desktop.yml
    permissions:
      contents: read
      actions: read
    with:
      matrix: ${{ inputs.matrix || '' }}
      version: ${{ inputs.version || '0.0.1' }}
      updates: ${{ inputs.updates || false }}
      environment: ${{ inputs.environment || '' }}

name: Desktop test builds

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      updates:
        type: boolean
        default: false
      matrix:
        type: string
        required: true
      version:
        type: string
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: test package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix || '{"include":[{"os":"windows-latest","target":"x86_64-pc-windows-msvc"},{"os":"macos-15","target":"aarch64-apple-darwin"},{"os":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu"}]}') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1" # Keep aligned with rust-toolchain.toml.
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpipewire-0.3-dev libclang-dev pkg-config cmake libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - name: Packaging script tests
        run: node --test scripts/build-test-desktop.test.mjs
      - name: Desktop tests
        run: cargo test --locked -p socialspeak-desktop
      - name: Frontend checks
        working-directory: apps/desktop
        run: pnpm check
      - name: Import macOS signing certificate
        if: runner.os == 'macOS' && inputs.updates
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            test -n "$APPLE_CERTIFICATE"
            keychain_password=$(openssl rand -hex 32)
            echo "::add-mask::$keychain_password"
            printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
            security create-keychain -p "$keychain_password" "$RUNNER_TEMP/sideband.keychain"
            security set-keychain-settings -lut 21600 "$RUNNER_TEMP/sideband.keychain"
            security unlock-keychain -p "$keychain_password" "$RUNNER_TEMP/sideband.keychain"
            security import "$RUNNER_TEMP/signing.p12" -k "$RUNNER_TEMP/sideband.keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$RUNNER_TEMP/sideband.keychain"
            security list-keychains -d user -s "$RUNNER_TEMP/sideband.keychain" login.keychain-db
            rm "$RUNNER_TEMP/signing.p12"
          fi
      - name: Import Windows signing certificate
        if: runner.os == 'Windows' && inputs.updates
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ($env:WINDOWS_CERTIFICATE) {
            $certPath = Join-Path $env:RUNNER_TEMP 'signing.pfx'
            [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            try {
              $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
              $cert = Import-PfxCertificate -FilePath $certPath -CertStoreLocation Cert:\CurrentUser\My -Password $password | Where-Object HasPrivateKey | Select-Object -First 1
              if (-not $cert) { throw "PFX contains no signing identity" }
              "WINDOWS_CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
            } finally { Remove-Item $certPath }
          }
      - name: Create labelled test packages
        id: packages
        shell: bash
        env:
          BUILD_VERSION: ${{ inputs.version || '0.0.1' }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
          BUILD_UPDATES: ${{ inputs.updates }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          args=()
          if [ "$BUILD_UPDATES" = "true" ]; then args+=(--updates); fi
          node scripts/build-test-desktop.mjs --target ${{ matrix.target }} --version "$BUILD_VERSION" "${args[@]}"
      - name: Validate macOS bundle
        if: runner.os == 'macOS'
        run: |
          bundle_root=target
          if ! rustc -vV | grep -qx 'host: ${{ matrix.target }}'; then
            bundle_root="target/${{ matrix.target }}"
          fi
          app_bundle="$bundle_root/release/bundle/macos/Sideband.app"
          codesign --verify --deep --strict --verbose=2 "$app_bundle"
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$app_bundle/Contents/Info.plist"
          codesign -d --entitlements :- "$app_bundle"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sideband-test-${{ matrix.target }}-${{ github.sha }}
          path: ${{ steps.packages.outputs.artifact_directory }}
          if-no-files-found: error
          retention-days: 30

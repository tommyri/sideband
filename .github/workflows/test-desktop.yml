name: Desktop test builds

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: test package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpipewire-0.3-dev libclang-dev pkg-config cmake libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - name: Packaging script tests
        run: node --test scripts/build-test-desktop.test.mjs
      - name: Desktop tests
        run: cargo test --locked -p socialspeak-desktop
      - name: Frontend checks
        working-directory: apps/desktop
        run: pnpm check
      - name: Create labelled test packages
        id: packages
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: node scripts/build-test-desktop.mjs --target ${{ matrix.target }}
      - name: Validate macOS bundle
        if: runner.os == 'macOS'
        run: |
          bundle_root=target
          if ! rustc -vV | grep -qx 'host: ${{ matrix.target }}'; then
            bundle_root="target/${{ matrix.target }}"
          fi
          app_bundle="$bundle_root/release/bundle/macos/Sideband.app"
          codesign --verify --deep --strict --verbose=2 "$app_bundle"
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$app_bundle/Contents/Info.plist"
          codesign -d --entitlements :- "$app_bundle"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sideband-test-${{ matrix.target }}-${{ github.sha }}
          path: ${{ steps.packages.outputs.artifact_directory }}
          if-no-files-found: error
          retention-days: 30

name: Release server

on:
  workflow_dispatch:
    inputs:
      version:
        description: Image version (X.Y.Z); replaces this version and latest
        required: true
        default: "0.0.1"
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: server-releases
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            arch: amd64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Validate image version
        env:
          VERSION: ${{ inputs.version }}
        run: '[[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1" # Keep aligned with rust-toolchain.toml.
          targets: ${{ matrix.target }}
      - name: musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true
      - name: Static binary
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          cargo build -p ss-server --locked --release --target "${{ matrix.target }}"
          strip --strip-unneeded "target/${{ matrix.target }}/release/ss-server"
          if readelf -l "target/${{ matrix.target }}/release/ss-server" | grep -q 'INTERP'; then
            echo "ss-server is dynamically linked" >&2
            exit 1
          fi
          install -m 0755 "target/${{ matrix.target }}/release/ss-server" \
            "$RUNNER_TEMP/ss-server-${{ matrix.target }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ss-server-${{ matrix.target }}
          path: ${{ runner.temp }}/ss-server-${{ matrix.target }}
      - name: Package and smoke-test image
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ inputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-server"
          tag="build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ARCH}"
          echo "SERVER_IMAGE=$image:$tag" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/image/data"
          install -m 0755 "target/$TARGET/release/ss-server" "$RUNNER_TEMP/image/ss-server"
          docker build -f deploy/Dockerfile.release \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" \
            -t "$image:$tag" "$RUNNER_TEMP/image"
          docker run -d --name server-smoke --cap-add NET_BIND_SERVICE \
            -p 127.0.0.1:19101:9101 -p 127.0.0.1:19443:443 \
            -e SS_BIND_QUIC=0.0.0.0:443 -e SS_BIND_HTTP=0.0.0.0:443 \
            -e SS_INTERNAL_BIND=0.0.0.0:9101 "$image:$tag"
          trap 'docker rm -fv server-smoke' EXIT
          curl --retry 30 --retry-delay 1 --retry-all-errors --max-time 2 --fail \
            http://127.0.0.1:19101/healthz
          curl --insecure --fail https://127.0.0.1:19443/api/v1/server
      - name: Push architecture image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$SERVER_IMAGE"
          docker logout ghcr.io

  image:
    name: Publish multi-platform image
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Publish version, latest and commit tags
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-server"
          build="build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create \
            -t "$image:$VERSION" -t "$image:latest" -t "$image:sha-$GITHUB_SHA" \
            "$image:$build-amd64" "$image:$build-arm64"
          docker buildx imagetools inspect "$image:$VERSION"
          docker logout ghcr.io
          echo "Published: \`$image:$VERSION\` (linux/amd64 and linux/arm64)" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/server-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          find dist -type f -exec cp {} "$RUNNER_TEMP/release/" \;
          cp deploy/socialspeak.service "$RUNNER_TEMP/release/socialspeak.service"
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/release/"* \
            --title "$GITHUB_REF_NAME" \
            --notes "Static ss-server binaries and the systemd unit. See deploy/README.md."

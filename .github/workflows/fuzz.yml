name: Fuzz

# Manual: every cargo-fuzz target for ten minutes. A crash, timeout, or leak
# fails the job and uploads the reproducer. Corpora persist in the cache.
# fuzz/Cargo.lock is its own lockfile (see fuzz/README.md). cargo-fuzz 0.13 has
# no --locked flag, so a locked fetch checks it first and the run must leave it
# unchanged.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target:
          - control_frames
          - control_stream
          - video_group
          - media_headers
          - mentions
          - preview_html
          - multipart_upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - name: Locked dependencies
        run: cargo +nightly fetch --locked --manifest-path fuzz/Cargo.toml
      - name: Restore corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz for ten minutes
        run: >
          cargo +nightly fuzz run ${{ matrix.target }} --
          -max_total_time=600 -timeout=10 -rss_limit_mb=2048 -max_len=8192
      - name: Lockfile unchanged
        run: git diff --exit-code -- fuzz/Cargo.lock
      - name: Upload reproducer
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}

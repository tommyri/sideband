name: Desktop signing check (temporary)

# TEMPORARY while desktop 0.0.2 is released; delete afterwards.
# Builds the macOS and Windows packages with updates on and runs both signing
# jobs, exactly as release-desktop.yml's `build` job does, but without CI,
# Linux or publishing. Nothing is uploaded except the run's own artifacts.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/test-desktop.yml
    permissions:
      contents: read
      actions: read
    with:
      matrix: '{"include":[{"os":"windows-2025","target":"x86_64-pc-windows-msvc"},{"os":"macos-15","target":"aarch64-apple-darwin"}]}'
      version: 0.0.2
      updates: true
      environment: desktop-signing

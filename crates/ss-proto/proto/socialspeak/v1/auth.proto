syntax = "proto3";

package socialspeak.v1;

import "socialspeak/v1/channels.proto";
import "socialspeak/v1/common.proto";
import "socialspeak/v1/messages.proto";
import "socialspeak/v1/roles.proto";
import "socialspeak/v1/voice.proto";

// Session open, keepalive, and the full state snapshot.
// Spec: docs/plan/02-protocol.md sections 1, 3, and 7.

// Username and password login inside `Hello.auth`.
message Login {
  // Account username.
  string username = 1;
  // Password. The server hashes it; the hash is never sent back.
  string password = 2;
}

// New account inside `Hello.auth`.
message Register {
  // Invite code, not the invite id.
  string invite_code = 1;
  // Desired unique username.
  string username = 2;
  // Password. The server hashes it.
  string password = 3;
}

// Sign in to a server-scoped membership with an enrolled Ed25519 device key.
message ProfileAuth {
  // Server-scoped 32-byte Ed25519 membership public key.
  bytes membership_key = 1;
  // Server-scoped 32-byte Ed25519 device public key.
  bytes device_key = 2;
  // Device signature over the TLS exporter and both public keys.
  bytes device_signature = 3;
  // First enrollment only. A retry with the same enrolled device is a login.
  ProfileRegister register = 4;
}

// Register a new membership and authorize its first device.
message ProfileRegister {
  // Desired unique name on this server.
  string username = 1;
  // Bootstrap or regular invite. Validated by the normal registration policy.
  string invite_code = 2;
  // Membership signature authorizing this device public key.
  bytes membership_signature = 3;
}

// First message on the control stream.
message Hello {
  // Must be `PROTOCOL_VERSION` (1) for this schema.
  uint32 protocol_version = 1;
  // Short client product name.
  string client_name = 2;
  // Client build version.
  string client_version = 3;
  // Operating system label.
  string os = 4;
  // Exactly one credential. Field names are stable JSON keys.
  oneof auth {
    // Existing session token.
    string session_token = 5;
    // Token from a previous `Welcome`, used after a dropped connection.
    string resume_token = 6;
    // Password login.
    Login login = 7;
    // Invite registration.
    Register register = 8;
    // Bot token from `CreateBot` or `ResetBotToken`. Authenticates the bot
    // account; never a user session. `Welcome.resume_token` echoes it.
    string bot_token = 9;
    // Connection-bound, server-scoped profile credential.
    ProfileAuth profile = 10;
  }
}

// Client keepalive. Sent about every 15 seconds while idle.
message Ping {
  // Client clock, Unix milliseconds, echoed by `Pong`.
  int64 sent_at = 1;
}

// Server reply to `Ping`.
message Pong {
  // `Ping.sent_at`, unchanged.
  int64 sent_at = 1;
  // Server clock, Unix milliseconds.
  int64 server_time = 2;
}

// Full state pushed on a successful `Hello`.
message Snapshot {
  // Channel tree. `parent_id` links children to categories.
  repeated Channel channels = 1;
  // Every role, including @everyone.
  repeated Role roles = 2;
  // Members with presence.
  repeated Member members = 3;
  // Current voice sessions.
  repeated VoiceState voice_states = 4;
  // Audio and video tracks used to demux datagrams.
  repeated Track tracks = 5;
  // Read cursors for the connecting user.
  repeated ReadState read_states = 6;
  // DM and group-DM channels this user belongs to, most recently active
  // first. Only the newest page when `direct_messages_next` is set.
  repeated Channel direct_messages = 7;
  // Present when `direct_messages` was cut short. Pass it as
  // `ListDms.cursor` to load older conversations. Read cursors for those
  // come with each `DmPage`, not in `read_states`.
  optional bytes direct_messages_next = 8;
}

// Load older DMs than a `Welcome` carried, most recently active first.
message ListDms {
  // `Snapshot.direct_messages_next` or `DmPage.next`. Opaque. Absent starts
  // from the most recently active conversation.
  optional bytes cursor = 1;
  // Page size, at most 100. Zero means 100.
  uint32 limit = 2;
}

// One page of `ListDms`.
message DmPage {
  // Conversations, most recently active first.
  repeated Channel channels = 1;
  // The caller's read cursors for these conversations.
  repeated ReadState read_states = 2;
  // Pass as `ListDms.cursor` for the next page. Absent on the last page.
  optional bytes next = 3;
}

// Successful `Hello` response. Not an `Ack`.
message Welcome {
  // The authenticated user.
  User user = 1;
  // Server name, version, and features.
  ServerInfo server_info = 2;
  // Present this on the next `Hello` after a disconnect.
  string resume_token = 3;
  // Full channel tree, roles, members, voice, tracks, reads, and DMs.
  Snapshot snapshot = 4;
  // 16-byte id of this connection: the `conn_id` on its own voice states and
  // tracks. A resume that restores a leased voice seat keeps the old id.
  // Empty from servers that predate it.
  bytes conn_id = 5;
}

// Change the connecting user's display name or avatar.
message UpdateProfile {
  // New display name. Empty leaves the stored name to server policy.
  string display_name = 1;
  // 16-byte attachment id. Absent leaves the avatar unchanged.
  optional bytes avatar_attachment_id = 2;
}

// End the session that authenticated this connection. The token stops
// working for QUIC and HTTPS at once. The `Ack` is the last frame on this
// connection; the server then closes it with code 6 (signed out). Other
// connections that used the same token get `SessionRevoked` and are closed.
message Logout {}

// List the caller's own sessions. Answered with `Ack.sessions`.
message ListSessions {}

// End one of the caller's own sessions. Revoking the current one is a
// `Logout`. Another account's session id is `NOT_FOUND`.
message RevokeSession {
  // 16-byte session id from `ListSessions`.
  bytes session_id = 1;
}

// One login session. Tokens and token hashes are never sent.
message SessionInfo {
  // 16-byte session id.
  bytes id = 1;
  // `Hello.client_name` at login, at most 64 characters.
  string device_name = 2;
  // Login time, Unix milliseconds.
  int64 created_at = 3;
  // Last `Hello` or HTTPS request with this token, Unix milliseconds.
  int64 last_seen_at = 4;
  // When the token stops working unless it is used again first. Never later
  // than `created_at` plus the absolute lifetime.
  int64 expires_at = 5;
  // The session this connection authenticated with.
  bool current = 6;
}

// `ListSessions` result, oldest first.
message SessionList {
  // The caller's live sessions.
  repeated SessionInfo sessions = 1;
}

// The server ended this connection's session: a logout or revoke elsewhere,
// a password reset, or the operator. Sent, then the connection is closed with
// code 6. The token no longer works; do not reconnect with it.
message SessionRevoked {
  // Human-readable reason. Not a stable token.
  string reason = 1;
}

syntax = "proto3";

package socialspeak.v1;

// Shared wire types for SocialSpeak protocol v1.
//
// Spec: docs/plan/02-protocol.md section 3.
//
// Ids on entity messages are raw `bytes` (16-byte ULIDs). Timestamps on
// entity messages are `int64` Unix milliseconds. `Id` and `Timestamp` below
// are the named forms of those two scalars.
//
// Permission bits are uint64 values, not a nested message, so
// `Role.permissions` and channel-override allow/deny stay scalar u64s
// (`permissions(u64)` in the spec). Bit 0 is the least significant bit.
// Positions match docs/plan/03-data-model.md and `ss_proto::validate`:
//
// 0 ADMINISTRATOR
// 1 MANAGE_SERVER
// 2 MANAGE_CHANNELS
// 3 MANAGE_ROLES
// 4 MANAGE_MESSAGES
// 5 KICK_MEMBERS
// 6 BAN_MEMBERS
// 7 MUTE_MEMBERS
// 8 MOVE_MEMBERS
// 9 VIEW_CHANNEL
// 10 SEND_MESSAGES
// 11 ATTACH_FILES
// 12 MENTION_EVERYONE
// 13 CONNECT
// 14 SPEAK
// 15 STREAM
// 16 CREATE_INVITES
// 17 VIEW_AUDIT_LOG
// 18 CHANGE_NICKNAME

// A 16-byte ULID.
message Id {
  // Exactly 16 bytes. Validate with `ss_proto::validate_id`.
  bytes value = 1;
}

// Unix time in milliseconds.
message Timestamp {
  // Milliseconds since the Unix epoch. Negative values are before the epoch.
  int64 unix_ms = 1;
}

// Ack payload for commands that return no resource.
message Empty {}

// Failure codes for `Error.code`.
//
// Zero is unspecified and is not a failure the server sends on purpose.
// Named codes match docs/plan/02-protocol.md section 3.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_UNAUTHENTICATED = 1;
  ERROR_CODE_FORBIDDEN = 2;
  ERROR_CODE_NOT_FOUND = 3;
  ERROR_CODE_INVALID = 4;
  ERROR_CODE_RATE_LIMITED = 5;
  ERROR_CODE_CONFLICT = 6;
  ERROR_CODE_BANNED = 7;
  ERROR_CODE_INTERNAL = 8;
  ERROR_CODE_PROTOCOL_VERSION = 9;
}

// Account kind.
//
// Wire numbers are not the SQL integers in docs/plan/03-data-model.md.
// Zero means the sender did not set a kind.
enum UserKind {
  USER_KIND_UNSPECIFIED = 0;
  USER_KIND_USER = 1;
  USER_KIND_BOT = 2;
}

// A user visible to clients.
//
// Password hashes and session secrets stay off this message.
message User {
  // 16-byte ULID.
  bytes id = 1;
  // Unique login name.
  string username = 2;
  // Name shown in the member list and on messages.
  string display_name = 3;
  // 16-byte attachment id, absent when the user has no avatar.
  optional bytes avatar_attachment_id = 4;
  // User or bot.
  UserKind kind = 5;
}

// Coarse presence. Unspecified means the server sent no status.
enum PresenceStatus {
  PRESENCE_STATUS_UNSPECIFIED = 0;
  PRESENCE_STATUS_OFFLINE = 1;
  PRESENCE_STATUS_ONLINE = 2;
  PRESENCE_STATUS_IDLE = 3;
  PRESENCE_STATUS_DND = 4;
}

// Presence shown next to a member.
message Presence {
  // Online, idle, do-not-disturb, or offline.
  PresenceStatus status = 1;
  // Free-form activity text. Empty when unset.
  string activity = 2;
}

// A server member: profile, role ids, and presence.
message Member {
  // Profile. Absent only in a malformed payload.
  User user = 1;
  // Role ids (16-byte ULIDs), not full role records.
  repeated bytes roles = 2;
  // Current presence. Absent when unknown.
  Presence presence = 3;
}

// Public server description carried on `Welcome`.
message ServerInfo {
  // Display name from server settings.
  string name = 1;
  // Server build version string.
  string version = 2;
  // Feature flags the server wants clients to know about.
  repeated string features = 3;
}

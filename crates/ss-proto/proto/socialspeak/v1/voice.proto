syntax = "proto3";

package socialspeak.v1;

// Voice membership and media tracks.
// Spec: docs/plan/02-protocol.md sections 3, 4, and 5.
//
// `track_id` is a server-assigned integer for one (connection, kind), not a
// ULID. The datagram header carries it as a 1 to 3 byte varint.

// What a track carries.
enum TrackKind {
  TRACK_KIND_UNSPECIFIED = 0;
  TRACK_KIND_AUDIO = 1;
  TRACK_KIND_VIDEO = 2;
  TRACK_KIND_SCREEN = 3;
}

// Codec parameters announced with a track.
message Codec {
  // Codec name, for example `opus` or `avc1.64001f`.
  string name = 1;
  // Sample rate in hertz. Zero for video.
  uint32 sample_rate = 2;
  // Channel count. Zero for video.
  uint32 channels = 3;
  // Codec-private data such as an AVC decoder configuration. Empty for Opus.
  bytes description = 4;
}

// One member's voice session.
message VoiceState {
  // User in voice.
  bytes user_id = 1;
  // Server-assigned connection id (16-byte ULID), not the QUIC connection id.
  bytes conn_id = 2;
  // Voice channel. Absent after the user leaves voice.
  optional bytes channel_id = 3;
  // Microphone muted locally.
  bool self_mute = 4;
  // Playback muted locally.
  bool self_deaf = 5;
  // Muted by a moderator.
  bool server_mute = 6;
}

// Join a voice channel, or switch to another one.
message JoinVoice {
  // Voice channel to join.
  bytes channel_id = 1;
  // Start self-muted.
  bool self_mute = 2;
  // Start self-deafened.
  bool self_deaf = 3;
}

// Leave the current voice channel.
message LeaveVoice {}

// Update mute and deaf without changing channel.
message SetVoiceState {
  // Microphone muted locally.
  bool self_mute = 1;
  // Playback muted locally.
  bool self_deaf = 2;
}

// A voice session changed.
message VoiceStateUpdated {
  // User in voice.
  bytes user_id = 1;
  // Server-assigned connection id (16-byte ULID).
  bytes conn_id = 2;
  // Voice channel. Absent when the user left voice.
  optional bytes channel_id = 3;
  // Microphone muted locally.
  bool self_mute = 4;
  // Playback muted locally.
  bool self_deaf = 5;
  // Muted by a moderator.
  bool server_mute = 6;
}

// A track the client can demux.
message Track {
  // Server-assigned track id. Not a ULID.
  uint32 track_id = 1;
  // Publishing user.
  bytes user_id = 2;
  // Publishing connection id (16-byte ULID).
  bytes conn_id = 3;
  // Audio, video, or screen.
  TrackKind kind = 4;
  // Codec parameters.
  Codec codec = 5;
  // Voice channel the track belongs to.
  bytes channel_id = 6;
  // Renditions the publisher can send, full first. Empty for audio and for a
  // publisher that sends one rendition.
  repeated Rendition renditions = 7;
}

// A track started. Map `track_id` before decoding datagrams.
message TrackAdded {
  // Server-assigned track id. Not a ULID.
  uint32 track_id = 1;
  // Publishing user.
  bytes user_id = 2;
  // Publishing connection id (16-byte ULID).
  bytes conn_id = 3;
  // Audio, video, or screen.
  TrackKind kind = 4;
  // Codec parameters.
  Codec codec = 5;
  // Voice channel.
  bytes channel_id = 6;
  // Renditions the publisher can send, full first. Empty for audio and for a
  // publisher that sends one rendition.
  repeated Rendition renditions = 7;
}

// A track ended.
message TrackRemoved {
  // Track id from `TrackAdded`.
  uint32 track_id = 1;
}

// Subscribe to a video or screen track. Audio is auto-subscribed.
message SubscribeTrack {
  // Track id from `TrackAdded`.
  uint32 track_id = 1;
  // The viewer decodes every rendition in `TrackAdded.renditions`, so the
  // server may switch it between them. Without it, the server forwards only
  // the full rendition (index 0).
  bool renditions = 2;
}

// Stop receiving a video or screen track.
message UnsubscribeTrack {
  // Track id from `TrackAdded`.
  uint32 track_id = 1;
}

// Ask the publisher for a video keyframe.
message RequestKeyframe {
  // Video or screen track id.
  uint32 track_id = 1;
  // Rendition that needs the keyframe. Set by the server on the event it
  // sends the publisher; ignored when a viewer sends the command.
  uint32 rendition = 2;
}

// Preferred quality for adaptation by the publisher; the server never transcodes.
message SetPreferredQuality {
  // Video or screen track id.
  uint32 track_id = 1;
  // Maximum frame height in pixels.
  uint32 max_height = 2;
  // Maximum frames per second.
  uint32 max_fps = 3;
}

// Publish one screen/video track in the current voice channel.
message StartStream {
  TrackKind kind = 1;
  Codec codec = 2;
  // Renditions this publisher can send, full first (index 0, described by
  // `codec`), then at most one lower one (index 1). Empty means one rendition.
  repeated Rendition renditions = 3;
}

// One encoded version of a video track. Each rendition is its own run of GOP
// streams; a stream's header flag bit 0 marks rendition 1.
message Rendition {
  // 0 for the full rendition, 1 for the low one.
  uint32 index = 1;
  // Encoded width in pixels.
  uint32 width = 2;
  // Encoded height in pixels.
  uint32 height = 3;
  // Encoded frames per second.
  uint32 fps = 4;
  // Target bitrate in bits per second.
  uint64 bitrate = 5;
  // Codec of this rendition. Absent means the track's `codec`.
  Codec codec = 6;
}
// End this connection's screen/video track (idempotent).
message StopStream {}
// Aggregate of active subscriptions; zero limits mean no preference.
message SubscriberHint {
  uint32 track_id = 1;
  uint32 max_height = 2;
  uint32 max_fps = 3;
  uint32 viewer_count = 4;
}

// Per-rendition delivery report for a publisher, about once a second and
// whenever a rendition gains its first subscriber or loses its last.
message SubscriberStats {
  // Published video or screen track.
  uint32 track_id = 1;
  // One entry per announced rendition, full first.
  repeated RenditionStats renditions = 2;
}

// Delivery of one rendition to its subscribers since the previous report.
message RenditionStats {
  // Rendition index from `StartStream.renditions`.
  uint32 index = 1;
  // Subscribers receiving this rendition now.
  uint32 subscribers = 2;
  // Subscribers whose link fell behind or whose group was reset.
  uint32 congested = 3;
  // Groups reset to this rendition's subscribers because they fell behind.
  uint32 resets = 4;
  // Largest estimated send backlog among them, in milliseconds.
  uint32 max_backlog_ms = 5;
  // Bytes forwarded for this rendition.
  uint64 bytes = 6;
}

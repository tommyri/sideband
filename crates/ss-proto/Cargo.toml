[package]
name = "ss-proto"
description = "Control-message schema, framing, and protocol version."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# Canonical protobuf JSON (`serde`) for every message, generated by
# `pbjson-build`. The server's bot API needs it; clients do not.
json = ["dep:pbjson", "dep:pbjson-build", "dep:serde"]

[dependencies]
ss-core.workspace = true
bytes.workspace = true
pbjson = { workspace = true, optional = true }
prost.workspace = true
serde = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true

[build-dependencies]
pbjson-build = { workspace = true, optional = true }
prost-build.workspace = true
protoc-bin-vendored.workspace = true

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true

[lints]
workspace = true

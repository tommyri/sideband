[package]
name = "ss-audio"
description = "Capture, playback, Opus, jitter buffer, and the mixer."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
aec = ["dep:sonora"]
# Reserved: no DeepFilterNet3 build meets the dependency and model rules (T-053 notes).
deepfilter = []
dred = ["opusic-c/dred"]
# Apple's full-duplex echo-cancelling Audio Unit. macOS only; enabling the
# feature on another target keeps the portable device backend unchanged.
macos-voiceio = ["dep:block2", "dep:coreaudio", "dep:objc2-audio-toolbox"]
rnnoise = ["dep:nnnoiseless"]

[dependencies]
nnnoiseless = { workspace = true, optional = true }
ss-core.workspace = true
opusic-c.workspace = true
rtrb.workspace = true
rubato.workspace = true
sonora = { workspace = true, optional = true }
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(not(target_os = "linux"))'.dependencies]
cpal.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { workspace = true, optional = true }
coreaudio = { workspace = true, optional = true }
objc2.workspace = true
objc2-audio-toolbox = { workspace = true, optional = true }
objc2-avf-audio.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { workspace = true, features = ["pipewire", "realtime"] }

[dev-dependencies]
allocation-counter.workspace = true
criterion.workspace = true
proptest.workspace = true

[[bench]]
name = "codec"
harness = false

[[bench]]
name = "processing"
harness = false

[lints]
workspace = true

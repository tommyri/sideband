[package]
name = "ss-video"
description = "Cross-platform screen capture and low-latency H.264 encoding for Sideband"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["capture", "software"]
capture = ["moq-video/capture"]
render = ["moq-video/render", "dep:wgpu"]
software = ["moq-video/openh264"]
pipewire = ["capture", "moq-video/pipewire"]
vaapi = ["moq-video/vaapi"]
nvidia = ["moq-video/nvidia"]

[dependencies]
hang = "=0.21.22"
wgpu = { version = "30", optional = true }
bytes.workspace = true
moq-net.workspace = true
moq-video.workspace = true
thiserror.workspace = true
tokio.workspace = true

[lints]
workspace = true

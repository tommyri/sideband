[package]
name = "ss-video"
description = "Cross-platform screen capture and low-latency H.264 encoding for SocialSpeak"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["capture", "software"]
capture = ["moq-video/capture"]

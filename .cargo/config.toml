[env]
# Keep Rust and bundled C/C++ dependencies on the documented macOS baseline.
# Ignored by non-Apple target toolchains; an explicit caller override still wins.
MACOSX_DEPLOYMENT_TARGET = "13.0"

# Used by the release workflow and `deploy/Dockerfile`. Ordinary host
# builds do not select these targets.
[target.x86_64-unknown-linux-musl]
linker = "musl-gcc"

[target.aarch64-unknown-linux-musl]
linker = "aarch64-linux-musl-gcc"
